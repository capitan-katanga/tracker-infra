services:
  postgres:
    image: 'pgvector/pgvector:pg17'
    command: ["postgres", "-c", "max_connections=100"]   # presupuesto de conexiones (ADR-013), ver README
    labels:
      # sin service connection: cada servicio usa su rol (spring.datasource.*), ver README
      org.springframework.boot.ignore: "true"
    environment:
      POSTGRES_DB: ExpenseTracker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}   # lo usa init/01-keycloak.sh
      # lo usa init/02-services.sh
      TRANSACTIONAL_DB_PASSWORD: ${TRANSACTIONAL_DB_PASSWORD:?set TRANSACTIONAL_DB_PASSWORD in .env}
      RECEIPT_PARSER_DB_PASSWORD: ${RECEIPT_PARSER_DB_PASSWORD:?set RECEIPT_PARSER_DB_PASSWORD in .env}
    ports:
      - '5332:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro       # solo corre con el volumen vacío
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ExpenseTracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
